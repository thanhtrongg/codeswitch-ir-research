candidate_method:
  id: unlabeled_relative_qpp_hard_selector_v1
  top_k: 10
  epsilon: 1.0e-12
  active_signal_families:
    - normalized_top1_minus_top2_score_margin
    - top_k_score_dispersion
  signal_selection_data: Climate_source_fit_outcomes_only
  signal_selection_metric: mean_per_query_winner_classification_accuracy
  winner_label: BM25_only_if_BM25_nDCG_at_10_strictly_exceeds_Qwen_else_Qwen
  tie_order: [margin, dispersion]
  removed_signal:
    id: retrieved_set_embedding_coherence
    status: removed_before_selection
    reason: no_validated_Qwen_Climate_corpus_embedding_cache
    existing_cache_observed: BGE_M3_Climate_only
    qwen_run_cache_path: null
    qwen_run_embeddings_persisted: false
    new_dense_encoding_authorized: false
  formulas:
    margin: >-
      M_r(q)=(s_r,1-s_r,2)/(abs(s_r,1-s_r,k)+epsilon); if the denominator is
      <= epsilon set M_r(q)=0.
    dispersion: >-
      z_r,i=(s_r,i-s_r,k)/(s_r,1-s_r,k+epsilon); if the score range is <=
      epsilon set all z values to zero; otherwise D_r(q) is population std,
      ddof=0.
  cdf_normalization:
    source_fit_only: true
    formula: F_r(x)=(1/N_fit)*sum(indicator(S_r(q)<=x)); P_r(q)=F_r(S_r(q)); G=P_Qwen-P_BM25
    ties_included: true
    frozen_for_target_transfer: true
    target_recalibration: false
  hard_rule:
    abs_G_le_tau: Qwen
    G_gt_tau: Qwen
    G_lt_negative_tau: BM25
    tau_grid: [0.00, 0.05, 0.10, 0.15, 0.20]
    threshold_selection_data: Climate_source_validation_only
    threshold_objective: highest_code_switched_nDCG_at_10
    threshold_ties: [higher_original_nDCG_at_10, smaller_abs_Delta_CS, smaller_tau, lexical_serialization_order]
    no_fusion: true
    no_exceptions: true

